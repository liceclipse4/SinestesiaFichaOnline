<script>
(function(){
if(window.__sinMenu)return;window.__sinMenu=1;
const RK='sin-roster',rawSet=Storage.prototype.setItem;
let R={},cur=null;
try{R=JSON.parse(localStorage.getItem(RK))||{}}catch(e){R={}}
const wr=()=>{try{rawSet.call(localStorage,RK,JSON.stringify(R));return true}catch(e){return false}};

/* migra a ficha antiga */
try{const old=localStorage.getItem('sin-ficha');
 if(old&&!Object.keys(R).length){const o=JSON.parse(old);if(o&&typeof o==='object'){const id=uid();R[id]={s:o,t:Date.now()};if(wr())localStorage.removeItem('sin-ficha');else delete R[id]}}}catch(e){}

/* o save() original passa a gravar no personagem aberto */
Storage.prototype.setItem=function(k,v){
 if(this===localStorage&&k==='sin-ficha'){
  if(!cur||!R[cur])return;
  try{R[cur]={s:JSON.parse(v),t:Date.now()}}catch(e){return}
  if(!wr())throw new Error('quota');
  return;
 }
 return rawSet.apply(this,arguments);
};

const css=`
#menu{position:fixed;inset:0;z-index:100;overflow:auto;padding:28px 16px 48px;background:linear-gradient(180deg,#cfe6ff,#eadcff 45%,#ffe4ec)}
#menu[hidden]{display:none}
html[data-tema=escuro] #menu{background:linear-gradient(180deg,#14122a,#1a1538 50%,#201636)}
html[data-tema=singular] #menu{background:radial-gradient(circle at 20% 10%,rgba(124,58,237,.35),transparent 50%),#000}
html[data-c6] #menu{background:radial-gradient(circle at 50% 30%,#3a0018,#000 70%)}
#menu .mw{max-width:1000px;margin:0 auto}
#menu .mt{font:800 clamp(28px,5vw,42px) "Bricolage Grotesque",sans-serif;background:linear-gradient(90deg,#e11d48,#f97316,#ca8a04,#16a34a,#0891b2,#4c6fff,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
#menu .mgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin:20px 0}
#menu .mc{background:var(--pn);border:1px solid var(--ln);border-top:6px solid var(--mc,#9b6bff);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(76,60,160,.18);transition:transform .15s}
#menu .mc:hover{transform:translateY(-4px)}
#menu .mo{display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;box-shadow:none;border-radius:0;color:var(--tx)}
#menu .mp{aspect-ratio:3/4;background:var(--pn2) center/cover no-repeat;display:grid;place-items:center;font:800 64px "Bricolage Grotesque",sans-serif;color:var(--sg)}
#menu .mi{padding:10px 12px}
#menu .mi b{display:block;font:800 18px "Bricolage Grotesque",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu .mi span{font-size:13px;color:var(--mu)}
#menu .ma{display:flex;gap:6px;padding:0 10px 10px}
#menu .ma button{flex:1;padding:4px 6px;font-size:13px}
#menu .mc.new{border:2px dashed var(--sg);border-top:2px dashed var(--sg);background:transparent;min-height:260px}
#menu .mc.new .mo{height:100%;display:grid;place-items:center;text-align:center;padding:20px}
#menu .mc.new .plus{display:block;font:800 64px sans-serif;color:var(--sg);line-height:1}
#menu .mc.new b{font:800 18px "Bricolage Grotesque",sans-serif}
#menu .mbar{display:flex;gap:8px;flex-wrap:wrap}
@media print{#menu{display:none!important}}
`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

const ov=document.createElement('div');ov.id='menu';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Seus personagens');
ov.innerHTML='<div class="mw"><div class="mt">Seus personagens</div><p class="note" id="mnote"></p><div class="mgrid" id="mgrid"></div><div class="mbar"><button type="button" id="mimp">Importar ficha (.json)</button><button type="button" id="mback" hidden>Voltar à ficha</button></div><input type="file" id="mfile" accept=".json" hidden></div>';
document.body.appendChild(ov);

const show=()=>{render();ov.hidden=false;document.body.style.overflow='hidden';$('#mback').hidden=!cur||!R[cur]};
const hide=()=>{ov.hidden=true;document.body.style.overflow=''};

function abrir(id){
 if(!R[id])return;
 cur=id;S=Object.assign(NEW(),R[id].s);fix();ROLL=null;EDIT=null;build();hide();window.scrollTo(0,0);
}
function criar(data){
 const id=uid();R[id]={s:Object.assign(NEW(),data||{}),t:Date.now()};
 if(!wr()){delete R[id];alert('Sem espaço no navegador. Exclua um personagem ou use fotos menores.');return}
 abrir(id);
}
function dup(id){
 const s=JSON.parse(JSON.stringify(R[id].s));s.info=s.info||{};s.info.nome=(s.info.nome||'Sem nome')+' (cópia)';
 const n=uid();R[n]={s,t:Date.now()};if(!wr()){delete R[n];alert('Sem espaço no navegador.');return}render();
}
function del(id){
 const nome=R[id].s.info&&R[id].s.info.nome||'este personagem';
 if(!confirm('Excluir "'+nome+'"? Isso não pode ser desfeito.'))return;
 delete R[id];if(cur===id)cur=null;wr();render();$('#mback').hidden=!cur||!R[cur];
}

function render(){
 const g=$('#mgrid');g.innerHTML='';
 Object.keys(R).sort((a,b)=>R[b].t-R[a].t).forEach(id=>{
  const s=R[id].s,nome=(s.info&&s.info.nome)||'Sem nome';
  const c=document.createElement('div');c.className='mc';
  const o=document.createElement('button');o.type='button';o.className='mo';o.setAttribute('aria-label','Abrir '+nome);
  const p=document.createElement('div');p.className='mp';
  if(s.port)p.style.backgroundImage='url("'+s.port+'")';else p.textContent=nome.trim().charAt(0).toUpperCase()||'?';
  const i=document.createElement('div');i.className='mi';
  const b=document.createElement('b');b.textContent=nome;
  const sp=document.createElement('span');sp.textContent=(s.cls||'Poderoso')+' · nível '+(s.nivel||1)+(s.sing?' · ⚡ '+s.sing+'/6':'');
  i.append(b,sp);o.append(p,i);o.onclick=()=>abrir(id);
  const a=document.createElement('div');a.className='ma';
  const d=document.createElement('button');d.type='button';d.textContent='Duplicar';d.onclick=()=>dup(id);
  const x=document.createElement('button');x.type='button';x.textContent='Excluir';x.onclick=()=>del(id);
  a.append(d,x);c.append(o,a);g.appendChild(c);
 });
 const n=document.createElement('div');n.className='mc new';
 n.innerHTML='<button type="button" class="mo"><span class="plus">＋</span><b>Criar nova ficha</b></button>';
 n.firstChild.onclick=()=>criar();g.appendChild(n);
 let kb=0;try{kb=JSON.stringify(R).length/1024}catch(e){}
 $('#mnote').textContent=Object.keys(R).length?'Escolha um personagem para continuar. Armazenamento usado: '+(kb/1024).toFixed(1)+' MB de cerca de 5 MB. Use "Baixar ficha" para guardar backups.':'Você ainda não tem personagens. Crie a primeira ficha!';
}

$('#mimp').onclick=()=>$('#mfile').click();
$('#mfile').onchange=e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;if(o.ovv!==2){o.ov={};o.ovv=2}criar(o)}catch(x){alert('Arquivo inválido. Abra uma ficha baixada deste site.')}};
 r.readAsText(f);
};
$('#mback').onclick=hide;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden&&cur&&R[cur])hide()});

/* botão no topo da ficha */
const hb=document.querySelector('header .bar');
if(hb){const b=document.createElement('button');b.type='button';b.textContent='☰ Personagens';b.onclick=show;hb.insertBefore(b,hb.firstChild)}

show();
})();
</script>
