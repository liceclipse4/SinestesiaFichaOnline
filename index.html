<script>
(function(){
if(window.__sinArm)return;window.__sinArm=1;
if(!window.__sinFix){alert('Cole este script DEPOIS do script de correções anterior.');return}
const css=`
.wbox{margin-top:10px;padding:10px;border-radius:8px;border:1px dashed var(--ln)}
.wbox.on{border:1px solid #e11d48;background:color-mix(in srgb,#e11d48 7%,transparent)}
.wsum{margin:8px 0 0;font-size:15px}
.card .wg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:8px}
.card.arma{border-left-color:#e11d48}
#stats .box .mini{margin-top:8px}
.box.esq{border-left-color:#16a34a}.box.esq b{color:#16a34a}
#stats .box input.rd{width:100%;margin-top:4px}
`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

/* ---------- dados da arma ---------- */
function parseW(t){
 const p=(t.o||'').split(' · ');
 if(p[0]!=='Simples'&&p[0]!=='Complexa')return false;
 t.tipo=p[0];t.alc=/dist/.test(p[1]||'')?'À distância':'Corpo a corpo';
 const d=(p[2]||'').replace(/^dano\s*/,'');t.dano=d==='-'?'':d;
 const c=(p[3]||'').replace(/^crítico\s*/,''),m=c.match(/^(\d+)?(?:x(\d+))?$/);
 t.marg=m&&m[1]?+m[1]:20;t.mult=m&&m[2]?+m[2]:2;
 t.tdano=p[4]||'';return true;
}
const defaults=t=>{t.tipo=t.tipo||'Personalizada';t.alc=t.alc||'Corpo a corpo';t.dano=t.dano??'';t.marg=t.marg||20;t.mult=t.mult||2;t.tdano=t.tdano??''};
const sum=t=>`⚔ <b>${esc(t.dano||'—')}${t.bd?' '+esc(t.bd):''}</b> · Ameaça ${(+t.marg||20)<20?(+t.marg)+'–20':'20'} · Crítico x${+t.mult||2}${t.tdano?' · '+esc(t.tdano):''}${t.atq?' · Ataque '+esc(t.atq):''}`;
const sel=(k,l,v,o)=>`<label>${l}<select data-w="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select></label>`;
const inp=(k,l,v,ex='',ty='text')=>`<label>${l}<input type="${ty}" data-w="${k}" value="${esc(v??'')}" ${ex}></label>`;
const wblock=t=>`<div class="wbox ${t.wp?'on':''}"><label class="chk"><input type="checkbox" data-wp ${t.wp?'checked':''}> É uma arma (dano, margem de ameaça, etc.)</label>${t.wp?`<div class="wsum">${sum(t)}</div><div class="g wg">`+
 sel('tipo','Tipo',t.tipo,['Simples','Complexa','Personalizada'])+
 sel('alc','Alcance',t.alc,['Corpo a corpo','À distância'])+
 inp('dano','Dano',t.dano,'placeholder="1d8"')+
 inp('bd','Bônus de dano',t.bd,'placeholder="+2"')+
 inp('atq','Bônus de ataque',t.atq,'placeholder="+1"')+
 inp('marg','Margem de ameaça (2 a 20)',t.marg,'min="2" max="20"','number')+
 inp('mult','Multiplicador de crítico',t.mult,'min="1" max="10"','number')+
 inp('tdano','Tipo de dano',t.tdano,'placeholder="Cortante"')+
 `<label class="wide">Propriedades e extras<textarea data-w="ext" rows="2">${esc(t.ext)}</textarea></label></div>`:''}</div>`;

const lists1=lists;
lists=function(){
 S.it.forEach(t=>{if(t.wp===undefined)t.wp=parseW(t)});
 lists1();
 document.querySelectorAll('#it .card').forEach((c,i)=>{
  const t=S.it[i];if(!t)return;
  c.classList.toggle('arma',!!t.wp);
  c.querySelector('.g').insertAdjacentHTML('afterend',wblock(t));
  c.querySelector('[data-wp]').onchange=e=>{t.wp=e.target.checked;if(t.wp)defaults(t);save();lists()};
  c.querySelectorAll('[data-w]').forEach(el=>{
   const k=el.dataset.w;
   el.oninput=el.onchange=()=>{t[k]=el.type==='number'?(el.value===''?'':+el.value):el.value;const s=c.querySelector('.wsum');if(s)s.innerHTML=sum(t);save()};
  });
 });
};

/* ---------- esquiva + RD ---------- */
const DF={'Uniforme':2,'Escudo':3,'Proteção leve':4,'Proteção pesada':6};
const dfOf=t=>t.df!=null&&t.df!==''?(+t.df||0):(DF[t.n]||0);
function esqInj(){
 const d=[...document.querySelectorAll('#stats .box')].find(b=>/^Defesa/.test((b.querySelector('span')||{}).textContent||''));
 if(!d)return;
 const ov0=k=>(S.ov&&S.ov[k])||0;
 const prot=S.it.reduce((s,t)=>s+(t.eq!==false?dfOf(t):0),0);
 const def=10+mod('DES')+prot+ov0('def');
 const refl=mod('DES')+TB[S.sk['Reflexos']||0]-pen()+ov0('sk:Reflexos');
 const us=S.esq|0,base=def+refl+S.nivel,val=base-2*us;
 d.insertAdjacentHTML('afterend',
  `<div class="box esq"><b>${val}</b><span>Esquiva = Defesa ${def} ${refl<0?'-':'+'} Reflexos ${Math.abs(refl)} + nível ${S.nivel}${us?` · −${2*us} (${us} esquiva${us>1?'s':''})`:''}</span><div class="mini noprint"><button type="button" id="esqB">Esquivar</button><button type="button" id="esqR">Resetar</button></div></div>`+
  `<div class="box"><span>RD (redução de dano)</span><input class="rd" id="rdI" value="${esc(S.rd||'')}" placeholder="0" aria-label="RD"></div>`);
 $('#esqB').onclick=()=>{S.esq=(S.esq|0)+1;calc()};
 $('#esqR').onclick=()=>{S.esq=0;calc()};
 $('#rdI').oninput=e=>{S.rd=e.target.value;save()};
}
const calc1=calc;
calc=function(){calc1();esqInj()};

lists();calc();
})();
</script>
