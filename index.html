  else if(a==='asave'){ok(await sb.from('campanhas').update({capa:AP.capa||'',icone:AP.icone,cor:String(AP.cor)}).eq('id',CMP.id));M='Aparência da campanha salva.'}
  else if(a==='copy'){await navigator.clipboard.writeText(v);M='Código copiado: '+v}
  else if(a==='leave'){if(!confirm('Sair desta campanha?'))return;ok(await sb.from('membros').delete().eq('campanha_id',v).eq('user_id',U.id));M='Você saiu da campanha.'}
  else if(a==='det'){go('c:'+v);return}
  else if(a==='env'||a==='ret'){S.cloud=Object.assign({},S.cloud,{cid:a==='env'?v:null});save();await push();M=a==='env'?'Ficha enviada. O mestre já pode vê-la.':'Ficha retirada da campanha.'}
  else if(a==='open'){abrir(ok(await sb.from('fichas').select('id,data,campanha_id').eq('id',v).single()));return}
  else if(a==='delc'){if(!confirm('Excluir esta campanha? As fichas dos jogadores continuam com eles.'))return;ok(await sb.from('campanhas').delete().eq('id',v));go('camps');return}
 }catch(e){M='Erro: '+(e.message||e)}
 render();
}

/* ---------- páginas ---------- */
const BFS='<svg class="bf hb1" style="--c:#ff6b7a" viewBox="0 0 64 48" aria-hidden="true"><use href="#bf"/></svg><svg class="bf hb2" style="--c:#4c7dff" viewBox="0 0 64 48" aria-hidden="true"><use href="#bf"/></svg><svg class="bf hb3" style="--c:#f4c430" viewBox="0 0 64 48" aria-hidden="true"><use href="#bf"/></svg><svg class="lt hb1" style="--c:#d8b4fe" viewBox="0 0 40 60" aria-hidden="true"><use href="#bolt"/></svg><svg class="lt hb2" style="--c:#a855f7" viewBox="0 0 40 60" aria-hidden="true"><use href="#bolt"/></svg><svg class="lt hb3" style="--c:#e9d5ff" viewBox="0 0 40 60" aria-hidden="true"><use href="#bolt"/></svg>';
const tb=(k,t,f,g)=>'<button type="button" data-'+k+'="'+f+'" onclick="'+g+'(\''+f+'\')">'+t+'</button>';
const THM='<div class="themes noprint" role="group" aria-label="Tema">'+'<span>Tema:</span>'+tb('tm','Claro','claro','setTema')+tb('tm','Escuro','escuro','setTema')+tb('tm','Singularidade','singular','setTema')+'<span class="sep">Borboletas e raios:</span>'+tb('fb','Na frente','frente','setFx')+tb('fb','Atrás dos blocos','tras','setFx')+tb('fb','Desativar','off','setFx')+'</div>';
const sec=(t,h,c)=>'<section'+(c?' class="'+c+'"':'')+'><h2>'+t+'</h2>'+h+'</section>';
const page=(t,sub,body,two,lead)=>BG+'<header>'+THM+'<div class="hero">'+(lead||EMB)+'<div><h1>'+esc(t)+'</h1><p>'+esc(sub)+'</p></div></div><div class="bar noprint"><button type="button" data-go="fichas">☰ Fichas</button><button type="button" data-go="camps">⚔ Campanhas</button><button type="button" data-go="perfil">☺ Perfil</button><button type="button" data-a="x">✕ Fechar</button></div>'+BFS+'</header><main class="'+(two?'two':'')+'">'+body+'</main>';
const avt=(u,big)=>{u=u||{};const c=pal(u.cor,u.id||u.nome),h=img(u.foto);return '<div class="av'+(big?' big':'')+'" style="--a1:'+c[0]+';--a2:'+c[1]+(h?';background-image:url(&quot;'+u.foto+'&quot;)':'')+'">'+(h?'':ico(u.icone||ICK[hs(u.id||u.nome||'')%ICK.length]))+'</div>'};

async function render(){
 if(hub.hidden)return;
 clearInterval(POLL);
 const my=++RT;let alt='';
 let t='Campanhas',sub='Reúna seus amigos em mesas online',body=M?sec('Aviso','<p class="nmsg">'+esc(M)+'</p>','full'):'',two=false,lead='';
 try{
  if(CFG)body+=sec('Configuração','<p class="note">Falta configurar a Project URL e a chave anon no script.</p>');
  else if(!sb)body+=sec('Conectando','<p class="note">Conectando...</p>');
  else if(!U){t='Entrar';sub='Salve suas fichas online e jogue em campanhas';body+=sec('Conta','<div class="g"><label>E-mail<input id="n-em" type="email" autocomplete="email"></label><label>Senha (mínimo 6)<input id="n-pw" type="password" autocomplete="current-password"></label></div><div class="bar" style="margin-top:12px"><button data-a="in">Entrar</button><button data-a="up">Criar conta</button></div><p class="note">Suas fichas continuam salvas neste aparelho de qualquer forma.</p>')}
  else if(V=='perfil'){t='Meu perfil';sub='Seu nome e foto aparecem para os amigos';body+=await vPerfil();lead=avt(Object.assign({id:U.id},P),true)}
  else if(V=='camps')alt=await vCamps();
  else{const r=await vCamp(V.slice(2));t=r.t;sub=r.sub;body+=r.body;two=r.two;lead=r.lead||''}
 }catch(e){body+=sec('Erro','<p class="note bad">'+esc(e.message||e)+'</p>')}
 if(my!==RT)return;
 hub.innerHTML=alt||page(t,sub,body,two,lead);
 hub.querySelectorAll('[data-tm]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tm==document.documentElement.dataset.tema));
 hub.querySelectorAll('[data-fb]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fb==document.documentElement.dataset.fx));
 document.title=(V.indexOf('c:')==0&&CMP?CMP.nome+' · ':'')+T0;
 if(U&&CMP&&V.indexOf('c:')==0)startChat();
}
async function vPerfil(){
 const f=ok(await sb.from('fichas').select('id,nome,updated_at').eq('owner',U.id).order('updated_at',{ascending:false}))||[];
 if(!P.icone)P.icone=ICK[hs(U.id)%ICK.length];
 if(P.cor===''||P.cor==null||!PAL[+P.cor])P.cor=hs(U.id)%8;
 PK={obj:P,paint:paintPav};
 return sec('Perfil','<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start"><div><div id="pavw">'+avt(Object.assign({id:U.id},P),true)+'</div><label style="margin-top:10px">Foto (opcional)<input id="pfoto" type="file" accept="image/*"></label><div class="bar" style="margin-top:6px"><button type="button" data-a="fotodel">Remover foto</button></div></div><div style="flex:1;min-width:230px"><label>Nome de usuário<input id="pn-nome" maxlength="30" value="'+esc(P.nome)+'" placeholder="'+esc((U.email||'').split('@')[0])+'"></label><div class="lb" style="margin-top:12px">Ícone e cor do avatar</div>'+picker(P)+'<div class="bar" style="margin-top:8px"><button data-a="psave">Salvar perfil</button></div><p class="note">Sem foto, seu avatar usa o ícone e a cor escolhidos. Entrou como '+esc(U.email)+'</p></div></div>')
 +sec('Fichas na nuvem','<div class="bar noprint"><button data-a="auto" aria-pressed="'+AUTO+'">Salvar automático: '+(AUTO?'ligado':'desligado')+'</button><button data-a="save">Salvar ficha aberta agora</button><button data-a="out">Sair da conta</button></div><div style="margin-top:12px">'
 +(f.map(x=>'<div class="card hrow"><span><b>'+esc(x.nome)+'</b><em>'+new Date(x.updated_at).toLocaleString('pt-BR')+'</em></span><button data-a="open" data-v="'+x.id+'">Abrir</button></div>').join('')||'<p class="note">Nenhuma ainda. Abra uma ficha e clique em "Salvar ficha aberta agora".</p>')
 +'</div><p class="note">Se a ficha já existe neste aparelho, "Abrir" troca ela pela versão da nuvem e recarrega a página.</p>');
}
async function vCamps(){
 const c=(await campQ(cols=>sb.from('campanhas').select(cols)))||[];
 const cards=c.map(x=>{const v=cover(x,x.id),m=x.mestre==U.id;
  return '<div class="mc" style="--c1:'+v.k[0]+';--c2:'+v.k[1]+'"><button type="button" class="mo" data-a="det" data-v="'+x.id+'" aria-label="Abrir '+esc(x.nome)+'"><div '+v.attrs+'><span class="rib">'+(m?'MESTRE':'JOGADOR')+'</span>'+v.inner+'</div><div class="mi"><b>'+esc(x.nome)+'</b><span>'+(m?'Código '+esc(x.codigo):'Campanha de amigos')+'</span></div></button><div class="ma">'+(m?'<button type="button" data-a="copy" data-v="'+esc(x.codigo)+'">Copiar código</button><button type="button" data-a="delc" data-v="'+x.id+'">Excluir</button>':'<button type="button" data-a="leave" data-v="'+x.id+'">Sair</button>')+'</div></div>'}).join('');
 return '<div class="mw">'+tabs('camps',true)+'<div class="mt">Suas campanhas</div><p class="note">'+(M?'<b class="nmsg">'+esc(M)+'</b> ':'')+(c.length?'Escolha uma campanha para abrir a página dela. O mestre personaliza a capa dentro da campanha.':'Você ainda não tem campanhas. Crie a primeira ou entre com um código!')+'</p><div class="mgrid">'+cards+'<div class="mc new"><button type="button" class="mo" data-a="newc"><span class="plus">＋</span><b>Criar nova campanha</b></button></div></div><div class="mbar"><button type="button" data-a="joinp">Entrar com código</button></div></div>';
}
async function vCamp(id){
 const c=await campQ(cols=>sb.from('campanhas').select(cols).eq('id',id).maybeSingle());
 if(!c){CMP=null;return{t:'Campanha',sub:'',two:false,body:sec('Não encontrada','<p class="note">Campanha não encontrada, ou você não participa dela.</p>')}}
 const m=c.mestre==U.id;
 const [f,mb]=await Promise.all([sb.from('fichas').select('id,nome,data,owner').eq('campanha_id',id),sb.from('membros').select('user_id,nick').eq('campanha_id',id)]);
 const ms=ok(mb)||[],ids=ms.map(x=>x.user_id);
 let pf=[];try{pf=ok(await sb.from('perfis').select('user_id,nome,foto,icone,cor').in('user_id',ids))||[]}catch(e){try{pf=ok(await sb.from('perfis').select('user_id,nome,foto').in('user_id',ids))||[]}catch(e2){}}
 NM={};ms.forEach(x=>{const p=pf.find(q=>q.user_id==x.user_id)||{};NM[x.user_id]={id:x.user_id,nome:p.nome||x.nick||'?',foto:p.foto||'',icone:p.icone,cor:p.cor}});
 CMP={id,m,nome:c.nome};SEEN=new Set();
 AP={capa:c.capa||'',icone:c.icone||ICK[hs(id)%ICK.length],cor:(c.cor!=null&&c.cor!==''&&PAL[+c.cor])?+c.cor:hs(id)%8};PK={obj:AP,paint:paintPrev};
 const cv=cover(AP,id);
 const mine=S.cloud&&S.cloud.cid==id;
 const d20='<button type="button" id="d20c" class="d20" data-a="roll" aria-label="Rolar d20"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 93,28 93,72 50,96 7,72 7,28"/><text x="50" y="62" text-anchor="middle" id="dnum">d20</text></svg></button>';
 const body=sec('Jogadores','<div class="st">'+ms.map(x=>'<div class="box" style="display:flex;gap:8px;align-items:center">'+avt(NM[x.user_id])+'<span>'+esc(NM[x.user_id].nome)+(x.user_id==c.mestre?'<br><em style="font-style:normal">Mestre</em>':'')+'</span></div>').join('')+'</div>','full')
 +(m?sec('Aparência da campanha','<div class="apar"><div class="cprevw"><div id="cprev" '+cv.attrs+'>'+cv.inner+'</div></div><div style="flex:1;min-width:230px"><label>Imagem de capa<input id="capaf" type="file" accept="image/*"></label><div class="bar" style="margin-top:8px"><button type="button" data-a="capadel">Remover imagem</button></div><div class="lb" style="margin-top:12px">Ícone e cor</div>'+picker(AP)+'<div class="bar" style="margin-top:8px"><button data-a="asave">Salvar aparência</button></div><p class="note">A imagem é reduzida automaticamente. Sem imagem, a capa usa o ícone e a cor.</p></div></div>','full'):'')
 +sec('Fichas','<div class="bar noprint">'+(mine?'<button data-a="ret">Retirar a ficha aberta daqui</button>':'<button data-a="env" data-v="'+id+'">Enviar a ficha aberta ('+esc((S.info&&S.info.nome)||'sem nome')+')</button>')+'</div><div style="margin-top:10px">'
  +((ok(f)||[]).map(x=>'<div class="card hrow">'+avt(NM[x.owner])+'<span><b>'+esc(x.nome)+'</b><em>'+esc(x.data.cls||'')+' · nível '+(x.data.nivel||1)+' · '+esc((NM[x.owner]||{}).nome||'?')+'</em></span><button data-a="open" data-v="'+x.id+'">'+(m&&x.owner!=U.id?'Ver e editar':'Abrir')+'</button></div>').join('')||'<p class="note">Nenhuma ficha enviada ainda.</p>')+'</div>'
  +(m?'<p class="note">Suas edições nas fichas dos jogadores vão para a nuvem com o "Salvar automático" ligado (aba Perfil).</p>':''))
 +sec('Dado e chat','<div class="hrow" style="margin-bottom:10px">'+d20+'<span class="dtxt"><b>Dado universal</b><em>Clique no d20. A rolagem aparece no chat para todos.</em></span></div><div id="cmsgs" aria-live="polite"></div><div class="cin"><input id="cin" maxlength="300" placeholder="Escreva uma mensagem..." aria-label="Mensagem"><button data-a="send">Enviar</button></div>');
 return{t:c.nome,sub:'Página da campanha'+(m?' · Código de convite: '+c.codigo:''),two:true,body,lead:avt({id:c.id,nome:c.nome,foto:c.capa,icone:c.icone,cor:c.cor},true)};
}
async function rolarD20(){
 const n=1+Math.floor(Math.random()*20),b=$('#d20c'),t=$('#dnum');if(!b||b.classList.contains('roll'))return;
 b.className='d20 roll';
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)await new Promise(r=>{let k=0;const i=setInterval(()=>{t.textContent=1+Math.floor(Math.random()*20);if(++k>8){clearInterval(i);r()}},55)});
 t.textContent=n;b.className='d20'+(n==20?' c20':n==1?' c1':'');
 ok(await sb.from('mensagens').insert({campanha_id:CMP.id,tipo:'dado',texto:String(n)}));loadMsgs();
}

/* ---------- chat (atualiza a cada 3 s) ---------- */
function addMsg(m){
 const L=$('#cmsgs');if(!L||SEEN.has(m.id))return;SEEN.add(m.id);
 const u=NM[m.user_id]||{nome:'?'},d=document.createElement('div');
 d.className='ms'+(m.tipo=='dado'?(m.texto=='20'?' c20':m.texto=='1'?' c1':''):'');
 const a=document.createElement('div');a.innerHTML=avt(u);
 const t=document.createElement('div'),b=document.createElement('b');b.textContent=u.nome;t.append(b,document.createElement('br'));
 if(m.tipo=='dado'){const n=document.createElement('span');n.className='dd';n.textContent=m.texto;t.append('🎲 d20: ',n)}else t.append(document.createTextNode(m.texto));
 d.append(a.firstChild,t);const bot=L.scrollHeight-L.scrollTop-L.clientHeight<80;L.appendChild(d);if(bot)L.scrollTop=L.scrollHeight;
}
async function loadMsgs(){
 if(!CMP||hub.hidden||V!=='c:'+CMP.id)return;
 try{const r=ok(await sb.from('mensagens').select('id,user_id,tipo,texto').eq('campanha_id',CMP.id).order('id',{ascending:false}).limit(40));(r||[]).reverse().forEach(addMsg)}catch(e){}
}
function startChat(){loadMsgs();POLL=setInterval(loadMsgs,3000)}

if(!CFG)init();
if(/^#campanha=/.test(location.hash))setTimeout(route,0);
})();
</script>
